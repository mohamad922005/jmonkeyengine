name: CI - Build & Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (JDK ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: [17]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Grant execute permission for Gradle wrapper (Linux)
        if: runner.os == 'Linux'
        run: chmod +x ./gradlew

      - name: Print environment info
        run: |
          java -version
          ./gradlew --version

      # Build the project 
      - name: Build (jme3-core)
        run: ./gradlew :jme3-core:assemble

      # Run tests 
      - name: Run jme3-core tests
        run: ./gradlew :jme3-core:test --rerun-tasks

      # generate coverage report (nice for documentation)
      - name: JaCoCo report (jme3-core)
        run: ./gradlew :jme3-core:test :jme3-core:jacocoTestReport --rerun-tasks

      # Upload test reports + coverage HTML as pipeline artifacts
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            **/build/reports/tests/test
            **/build/test-results/test
            jme3-core/build/reports/jacoco/test/html
